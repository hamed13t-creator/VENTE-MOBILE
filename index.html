<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a4868">
  <meta name="color-scheme" content="light dark">
  <title>Vente Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <a href="#/" data-tab class="logo" aria-label="Accueil"><img id="logo" src="icons/icon-192.png" alt=""></a>
    <span class="title">Vente Mobile</span>
    <button id="sync" class="sync" aria-label="Synchronisation"></button>
  </header>
  <main id="main"><p class="muted center">Chargement…</p></main>
  <nav id="nav" hidden>
    <a href="#/" data-tab>🏠<span>Accueil</span></a>
    <a href="#/bon/new" data-tab>🧾<span>Nouveau bon</span></a>
    <a href="#/clients" data-tab>👥<span>Clients</span></a>
    <a href="#/fournisseurs" data-tab>🚚<span>Fournisseurs</span></a>
    <a href="#/plus" data-tab>☰<span>Plus</span></a>
  </nav>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
  <script>
    // Mise en cache hors ligne + bandeau « Nouvelle version » (indépendant du reste de l'application)
    if ('serviceWorker' in navigator) {
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(r => setInterval(() => r.update().catch(() => {}), 30 * 60000)).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!had) { had = true; return; }
        if (document.getElementById('updbar')) return;
        const b = document.createElement('div'); b.id = 'updbar';
        b.innerHTML = '<span>Nouvelle version disponible</span><button>Recharger</button>';
        b.querySelector('button').onclick = () => location.reload();
        document.body.appendChild(b);
      });
    }
  </script>
</body>
</html>
